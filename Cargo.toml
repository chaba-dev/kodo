[workspace]
members = ["crates/kodo"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chaba-dev/kodo"
rust-version = "1.96"
version = "0.1.0"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.31.0"
ci = "github"
github-release = "announce"
hosting = "github"
installers = ["shell"]
packages = ["kodo"]
pr-run-mode = "upload"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
