---
name: Publish container

"on":
  release:
    types: [published]

permissions:
  attestations: write
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}" || {
            echo "::error::Release is not reachable from $DEFAULT_BRANCH"; exit 1;
          }
          tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$RELEASE_TAG points to $tag_sha, expected release commit $GITHUB_SHA"
            exit 1
          fi
          mix_version=$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"([^"]+)",?[[:space:]]*$/\1/p' mix.exs)
          cargo_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' Cargo.toml)
          if [ -z "$mix_version" ] || [ "$mix_version" != "$cargo_version" ] || [ "$RELEASE_TAG" != "v$mix_version" ]; then
            echo "::error::Release tag, mix.exs, and Cargo.toml versions must match"
            exit 1
          fi
          if [[ ! "$mix_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Project version is not strict stable SemVer: $mix_version"
            exit 1
          fi
          if [ "$RELEASE_PRERELEASE" != "false" ]; then
            echo "::error::The automated release flow currently publishes stable SemVer only"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require write-once release identities
        id: immutable
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          exact_tag="$IMAGE:$version"
          sha_tag="$IMAGE:sha-$GITHUB_SHA"

          inspect_digest() {
            docker buildx imagetools inspect "$1" 2>/dev/null |
              sed -n 's/^Digest:[[:space:]]*//p' | head -n 1
          }

          exact_digest=$(inspect_digest "$exact_tag" || true)
          sha_digest=$(inspect_digest "$sha_tag" || true)
          if [ -z "$exact_digest" ] && [ -z "$sha_digest" ]; then
            build=true
            digest=""
          elif [ -n "$exact_digest" ] && [ "$exact_digest" = "$sha_digest" ]; then
            build=false
            digest=$exact_digest
            echo "Both immutable tags already identify $digest; reusing it"
          else
            echo "::error::Immutable release tags are partial or disagree"
            printf 'Exact: %s\nSHA:   %s\n' "${exact_digest:-missing}" "${sha_digest:-missing}"
            exit 1
          fi

          {
            echo "build=$build"
            echo "digest=$digest"
            echo "exact_tag=$exact_tag"
            echo "sha_tag=$sha_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: publish
        if: steps.immutable.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.immutable.outputs.exact_tag }}
            ${{ steps.immutable.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image digest
        id: image
        env:
          BUILT_DIGEST: ${{ steps.publish.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.immutable.outputs.digest }}
        run: |
          digest=${BUILT_DIGEST:-$EXISTING_DIGEST}
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Missing or invalid immutable image digest: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Determine floating aliases
        id: aliases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          current=${RELEASE_TAG#v}
          current_major=${current%%.*}
          remainder=${current#*.}
          current_minor=${remainder%%.*}
          stable=("$current")
          major=("$current")
          minor=("$current")
          while IFS= read -r tag; do
            version=${tag#v}
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable+=("$version")
              [[ "$version" == "$current_major".* ]] && major+=("$version")
              [[ "$version" == "$current_major.$current_minor".* ]] && minor+=("$version")
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          [ "$current" = "$(printf '%s\n' "${stable[@]}" | sort -V | tail -1)" ] && latest=true || latest=false
          [ "$current" = "$(printf '%s\n' "${major[@]}" | sort -V | tail -1)" ] && major_alias=true || major_alias=false
          [ "$current" = "$(printf '%s\n' "${minor[@]}" | sort -V | tail -1)" ] && minor_alias=true || minor_alias=false
          printf 'latest=%s\nmajor=%s\nminor=%s\n' "$latest" "$major_alias" "$minor_alias" >> "$GITHUB_OUTPUT"

      - name: Update floating aliases
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          LATEST: ${{ steps.aliases.outputs.latest }}
          MAJOR: ${{ steps.aliases.outputs.major }}
          MINOR: ${{ steps.aliases.outputs.minor }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          major=${version%%.*}
          remainder=${version#*.}
          minor=${remainder%%.*}
          source="$IMAGE@$DIGEST"

          if [ "$MINOR" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:$major.$minor" "$source"
          fi
          if [ "$MAJOR" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:$major" "$source"
          fi
          if [ "$LATEST" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$source"
          fi

      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
