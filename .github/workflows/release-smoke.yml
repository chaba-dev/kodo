---
name: Release container smoke test

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  containers:
    name: Server container (${{ matrix.platform }})
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build server container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: kodo:release-smoke
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}

      - name: Verify container architecture and server version
        env:
          PLATFORM: ${{ matrix.platform }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release PR title: $PR_TITLE"
            exit 1
          fi
          expected_version=${BASH_REMATCH[1]}
          expected_architecture=${PLATFORM#linux/}
          image_architecture=$(docker image inspect kodo:release-smoke --format '{{.Architecture}}')
          if [ "$image_architecture" != "$expected_architecture" ]; then
            echo "::error::Image architecture $image_architecture does not match $expected_architecture"
            exit 1
          fi

          server_version=$(
            docker run --rm --platform "$PLATFORM" \
              --entrypoint /app/bin/kodo \
              -e DATABASE_URL=ecto://postgres:postgres@localhost/kodo_release_smoke \
              -e PHX_HOST=localhost \
              -e SECRET_KEY_BASE="$(printf 'a%.0s' {1..64})" \
              -e KODO_ARTIFACT_REVISION="$GITHUB_SHA" \
              -e KODO_DEPLOYMENT_GENERATION=0 \
              kodo:release-smoke \
              eval 'IO.write(Application.spec(:kodo, :vsn))'
          )
          if [ "$server_version" != "$expected_version" ]; then
            echo "::error::Server version $server_version does not match $expected_version"
            exit 1
          fi

  server-gate:
    name: Server release gate
    needs: containers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both server architectures
        env:
          APPLICABLE: >-
            ${{ github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.head.ref == 'release/next' &&
            github.event.pull_request.head.repo.full_name == github.repository }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          if [ "$APPLICABLE" != "true" ]; then
            echo "Server release checks do not apply to this pull request"
          elif [ "$CONTAINERS_RESULT" != "success" ]; then
            echo "::error::Not every server container check succeeded: $CONTAINERS_RESULT"
            exit 1
          fi
