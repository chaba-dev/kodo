---
name: Live provider smoke test

"on":
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Authorize and resolve PR
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/live-smoke-test' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      repository: ${{ steps.pull-request.outputs.repository }}
      revision: ${{ steps.pull-request.outputs.revision }}
    steps:
      - name: Resolve pull request revision
        id: pull-request
        uses: actions/github-script@v7
        with:
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('repository', pull.data.head.repo.full_name);
            core.setOutput('revision', pull.data.head.sha);

      - name: Acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Live provider smoke test queued for \`${{ steps.pull-request.outputs.revision }}\`.`,
            });

  smoke:
    name: Run live OpenAI smoke test
    needs: resolve
    environment: live-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MIX_ENV: test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_TEST_NAME: kodo_test
      LIVE_LLM_MODEL: ${{ vars.LIVE_LLM_MODEL || 'openai:gpt-4o-mini' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OTP_VERSION: "28.5"
      ELIXIR_VERSION: "1.20"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kodo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kodo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout requested PR revision
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: live-smoke-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: live-smoke-mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - name: Install Hex, Rebar, and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run live provider test
        run: mix test test/e2e/live_provider_full_stack_test.exs --include live_provider

  report:
    name: Report live smoke result
    needs: [resolve, smoke]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report result
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.smoke.result }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} Live provider smoke test **${outcome}** for \`${{ needs.resolve.outputs.revision }}\`.`,
            });
